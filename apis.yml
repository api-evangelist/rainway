aid: rainway
name: Rainway
description: >-
  Rainway is a developer platform for interactive application streaming, letting you
  embed and run native apps anywhere in a few lines of code. Its Stream SDK is built on
  WebRTC and ships runtimes for the Web, React, Node.js (native), .NET and C++, handling
  secure peer connections, low-latency media streaming, network adaptation and input.
  A small RESTful Hub API exposes the active peers connected to the Rainway Network,
  authenticated with an API key pair, for building multi-peer architectures. Rainway
  originated as a consumer game-streaming app (2017; consumer app wound down in 2022) and
  pivoted to the Stream SDK; the docs, Hub, and published packages remain live.
